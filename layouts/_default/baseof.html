<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ .Description | default .Site.Params.description }}">
  <link rel="icon" type="image/svg+xml" href="{{ "image/blue-sheep-icon.svg" | relURL }}">
  {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="Blue Sheep">{{ end }}
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ .Description | default .Site.Params.description }}">
  <meta property="og:image" content="{{ "image/band-session-202604.jpg" | absURL }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NKRMK72SGL"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-NKRMK72SGL');</script>
</head>
<body>
  <a class="skip-link" href="#main-content">本文へ移動</a>
  <header class="site-header wrap">
    <a class="brand" href="{{ "/" | relURL }}"><img class="brand-logo" src="{{ "image/blue-sheep-logo.svg" | relURL }}" alt="Blue Sheep" width="228" height="52"><span>音楽を持ち寄る、日曜日。</span></a>
    <nav aria-label="メインメニュー"><a href="{{ "/videos/" | relURL }}" {{ if eq .Type "videos" }}aria-current="page"{{ end }}>演奏動画</a><a href="{{ "/posts/" | relURL }}" {{ if eq .Section "posts" }}aria-current="page"{{ end }}>活動記録</a><a class="nav-contact" href="{{ "/contact/" | relURL }}" {{ if eq .RelPermalink "/contact/" }}aria-current="page"{{ end }}>参加・お問い合わせ</a></nav>
  </header>
  <main id="main-content">{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer wrap"><a class="brand" href="{{ "/" | relURL }}"><img class="brand-logo" src="{{ "image/blue-sheep-logo.svg" | relURL }}" alt="Blue Sheep" width="228" height="52"></a><p>新宿を中心に活動するセッショングループ</p><small>© {{ now.Year }} Blue Sheep</small></footer>
</body>
</html>
