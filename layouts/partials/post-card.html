<article class="post-card">{{ $videos := findRE `youtube\s+(?:id=)?[A-Za-z0-9_-]+` .RawContent 1 }}{{ with $videos }}{{ $id := replaceRE `youtube\s+(?:id=)?` "" (index . 0) }}<img class="post-thumbnail" src="https://i.ytimg.com/vi/{{ $id }}/hqdefault.jpg" alt="" width="480" height="360" loading="lazy">{{ end }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006年1月2日" }}</time><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>{{ with .Description }}<p>{{ . }}</p>{{ end }}<span class="card-arrow" aria-hidden="true">↗</span></article>
